server.port=8080

# Por defecto se usa el perfil "local" (archivo application-local.properties, que NO se sube a GitHub).
# Para otro entorno: DB_URL, DB_USER y DB_PASSWORD como variables de entorno y --spring.profiles.active=prod
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erplite_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
